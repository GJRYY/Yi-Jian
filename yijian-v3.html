function cancelCustomForm() {
  state.customForm = null;
  render();
}

async function saveCustomItem() {
  const form = state.customForm;
  if (!form || state.saving) return;
  if (!String(form.name || "").trim()) {
    state.customHint = "请至少填写商品名称。";
    render();
    return;
  }

  const price = Number(form.price);
  if (!Number.isFinite(price) || price <= 0) {
    state.customHint = "请填写一个大于 0 的商品价格。";
    render();
    return;
  }

  state.saving = true;
  state.customHint = "";
  render();

  const flat = {
    name: String(form.name).trim(),
    price,
    link: String(form.link || "").trim(),
    image: form.image || "",
    color: form.color || "",
    style: form.style || "",
    material: form.material || "",
    category: form.category || "",
    scenario: form.scenario || "",
    season: form.season || "",
    fit: form.fit || "",
    length: form.length || "",
    care: form.care || "",
    brand: form.brand || "",
    description: form.note || form.description || "",
    pros: form.pros || "",
    risks: form.risks || "",
  };
  // 来自链接解析、且用户没有修改过的字段，保持「自动获取」来源标注
  const autoFields = Object.entries(form._auto || {})
    .filter(([key, value]) => String(form[key] ?? "") === String(value))
    .map(([key]) => key);

  try {
    if (form.id) {
      const data = await apiFetch(`/api/products/${form.id}`, {
        method: "PATCH",
        body: JSON.stringify({ ...flat, autoFields }),
      });
      state.customItems = state.customItems.map((item) =>
        item.id === data.product.id ? data.product : item,
      );
    } else {
      const data = await apiFetch("/api/products", {
        method: "POST",
        body: JSON.stringify({ ...flat, autoFields }),
      });
      state.customItems = [...state.customItems, data.product];
    }
    state.customForm = null;
    state.customHint = "";
    state.parseResult = null;
  } catch (err) {
    state.customHint = err.message || "保存失败，请确认后端已启动。";
  } finally {
    state.saving = false;
  }
  render();
}

async function deleteCustomItem(id) {
  if (state.saving) return;
  state.saving = true;
  render();
  try {
    await apiFetch(`/api/products/${id}`, { method: "DELETE" });
    state.customItems = state.customItems.filter((item) => item.id !== id);
    if (state.customForm && state.customForm.id === id) state.customForm = null;
    if (state.customConfirmItem && state.customConfirmItem.id === id) {
      state.customConfirmItem = null;
    }
    state.customHint = "";
  } catch (err) {
    state.customHint = err.message || "删除失败，请重试";
  } finally {
    state.saving = false;
  }
  render();
}

async function parseCustomUrl() {
  const form = state.customForm;
  if (!form || state.parsing) return;
  const link = String(form.link || "").trim();
  if (!link) {
    state.parseResult = { ok: false, text: "请先粘贴商品链接。" };
    render();
    return;
  }
  state.parsing = true;
  state.parseResult = { ok: true, text: "正在读取页面的公开商品信息…" };
  render();

  try {
    const data = await apiFetch("/api/products/parse-url", {
      method: "POST",
      body: JSON.stringify({ url: link }),
    });

    if (data.status === "unsupported") {
      state.parseResult = { ok: false, text: data.message || "该平台暂不支持自动解析，请手动填写。" };
      return;
    }
    if (data.status === "failed") {
      state.parseResult = {
        ok: false,
        text: `解析失败：${data.message || "页面无法读取"}。可以直接手动填写，不影响后续流程。`,
      };
      return;
    }

    const fieldMap = {
      name: "name",
      price: "price",
      category: "category",
      color: "color",
      material: "material",
      fit: "fit",
      style: "style",
      scenario: "scenario",
      season: "season",
      length: "length",
      care: "care",
      brand: "brand",
      description: "description",
      image: "image",
    };
    const auto = {};
    for (const [key, entry] of Object.entries(data.fields || {})) {
      const target = fieldMap[key];
      if (!target || entry.value == null || entry.value === "") continue;
      form[target] = key === "price" ? String(entry.value) : entry.value;
      auto[target] = entry.value;
    }
    form._auto = { ...(form._auto || {}), ...auto };
    const count = Object.keys(auto).length;
    const warnings = (data.warnings || []).join(" ");
    state.parseResult = {
      ok: true,
      text: count
        ? `已自动填入 ${count} 个字段，请核对后保存。${warnings}`
        : "没有读取到可用的商品字段，请手动填写。",
    };
  } catch (err) {
    state.parseResult = {
      ok: false,
      text: `解析没有完成：${err.message || "请稍后再试"}`,
    };
  } finally {
    state.parsing = false;
  }
  render();
}

function openCustomConfirm(id) {
  const item = state.customItems.find((entry) => entry.id === id);
  if (!item) return;
  state.customConfirmItem = item;
  state.customHint = "";
  state.screen = "custom-confirm";
  render();
}

async function confirmCustomItem(id) {
  if (state.saving) return;
  state.saving = true;
  state.customHint = "";
  render();
  let ok = false;
  try {
    const data = await apiFetch(`/api/products/${id}/confirm`, {
      method: "POST",
    });
    state.customItems = state.customItems.map((item) =>
      item.id === id ? data.product : item,
    );
    state.customConfirmItem = data.product;
    ok = true;
  } catch (err) {
    state.customHint = err.message || "确认失败，请重试";
  } finally {
    state.saving = false;
  }
  if (ok) {
    state.customConfirmItem = null;
    state.customHint = "";
    state.screen = "custom-items";
  }
  render();
}

function handleInput(event) {
  const field = event.target.dataset.field;
  if (!field) return;
  if (field === "budget") state.answers.budget = event.target.value;
  if (field === "concernNote") state.answers.concernNote = event.target.value;
  if (field === "wardrobeNote") state.answers.wardrobeNote = event.target.value;
  if (field === "dealbreakerNote") state.answers.dealbreakerNote = event.target.value;

  if (field === "customImage" && event.target.files && event.target.files[0]) {
    const file = event.target.files[0];
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
      state.customHint = "只支持 JPG、PNG 或 WebP 格式的图片。";
      render();
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      state.customHint = "图片不能超过 5MB。";
      render();
      return;
    }
    state.saving = true;
    state.customHint = "";
    render();
    const body = new FormData();
    body.append("image", file);
    fetch("/api/uploads", { method: "POST", body })
      .then(async (response) => {
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(data?.error?.message || "上传失败");
        }
        if (state.customForm) {
          state.customForm.image = data.url;
          if (!state.customForm._auto) state.customForm._auto = {};
          delete state.customForm._auto.image;
        }
      })
      .catch((err) => {
        state.customHint = err.message || "上传失败，请重试";
      })
      .finally(() => {
        state.saving = false;
        render();
      });
    return;
  }

  const customFieldMap = {
    customLink: "link",
    customName: "name",
    customPrice: "price",
    customColor: "color",
    customStyle: "style",
    customMaterial: "material",
    customCategory: "category",
    customScenario: "scenario",
    customSeason: "season",
    customFit: "fit",
    customLength: "length",
    customCare: "care",
    customBrand: "brand",
    customPros: "pros",
    customRisks: "risks",
    customNote: "note",
  };
  if (customFieldMap[field] && state.customForm) {
    state.customForm[customFieldMap[field]] = event.target.value;
  }
}

function handleClick(event) {
  const actionElement = event.target.closest("[data-action]");
  if (!actionElement) return;
  const action = actionElement.dataset.action;

  if (action === "start-flow") return startFlow();
  if (action === "start-demo") return startDemo();
  if (action === "start-custom") return startCustom();
  if (action === "start-example") return startExample();
  if (action === "example-cart") return exampleCart();
  if (action === "go-cart") return goCart();
  if (action === "go-custom-items") return goCustomItems();
  if (action === "go-home") return goHome();
  if (action === "toggle-cart") return toggleCart(actionElement.dataset.id);
  if (action === "start-questions") return startQuestions();
  if (action === "question-back") return questionBack();
  if (action === "question-next") return questionNext();
  if (action === "single-choice") {
    return answerSingle(actionElement.dataset.key, actionElement.dataset.value);
  }
  if (action === "toggle-chip") {
    return toggleChip(actionElement.dataset.key, actionElement.dataset.value);
  }
  if (action === "budget-chip") return setBudget(actionElement.dataset.value);
  if (action === "budget-mode") return setBudgetMode(actionElement.dataset.value);
  if (action === "finish") return finish();
  if (action === "edit-answers") return editAnswers();
  if (action === "restart-comparison") return restartComparison();
  if (action === "add-custom-item") return openCustomForm();
  if (action === "edit-custom-item") return openCustomForm(actionElement.dataset.id);
  if (action === "delete-custom-item") return deleteCustomItem(actionElement.dataset.id);
  if (action === "save-custom-item") return saveCustomItem();
  if (action === "cancel-custom-form") return cancelCustomForm();
  if (action === "parse-custom-url") return parseCustomUrl();
  if (action === "open-custom-confirm") return openCustomConfirm(actionElement.dataset.id);
  if (action === "confirm-custom-item") return confirmCustomItem(actionElement.dataset.id);
}

function handleKeydown(event) {
  if (event.key !== "Enter") return;
  const active = document.activeElement;
  if (active?.dataset?.field === "budget") {
    const needsBudget = state.answers.budgetMode !== "unlimited";
    if (needsBudget && isBudgetValid(state.answers.budget)) {
      advanceQuestion();
    } else if (!needsBudget) {
      advanceQuestion();
    }
  }
}

function handleImageError(event) {
  const img = event.target;
  if (img instanceof HTMLImageElement) {
    img.classList.add("is-broken");
  }
}

function init() {
  const app = document.getElementById("app");
  if (!app) return;

  window.__yijian = {
    questionNext,
    toggleChip,
    answerSingle,
  };
  app.addEventListener("click", handleClick);
  app.addEventListener("input", handleInput);
  app.addEventListener("keydown", handleKeydown);
  app.addEventListener("error", handleImageError, true);
  render();
}

if (typeof document !== "undefined") {
  init();
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    PRODUCTS,
    EXAMPLE_IDS,
    decide,
    evaluateProducts,
    buildCandidates,
    buildContext,
    normalizeAnswers,
  };
}
</script>
